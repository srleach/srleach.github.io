<ul class="post-list">
  {%- for post in include.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%-d %b %Y' }}</time>
    <div>
      <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
      {%- if post.description %}
      <p>{{ post.description | escape }}</p>
      {%- endif %}
    </div>
  </li>
  {%- endfor %}
</ul>
