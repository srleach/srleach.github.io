---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
      {%- for category in page.categories %}
      <span class="tag">{{ category | escape }}</span>
      {%- endfor %}
    </p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
